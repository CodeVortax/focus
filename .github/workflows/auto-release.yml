name: Signed build on code change

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'ai/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Read version and detect a version bump
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          BUMP=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            if git diff "$BEFORE" HEAD -- app/build.gradle.kts | grep -qE '^\+\s*versionName'; then
              BUMP=true
            fi
          fi
          echo "BUMP=$BUMP" >> "$GITHUB_ENV"
          echo "version $VN (code $VC), version bump in this push: $BUMP"

      - name: Build signed release APKs
        run: gradle assembleRelease --stacktrace

      - name: Verify signatures and name the files
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/focus-v${VERSION_NAME}.apk"
          cp ai/build/outputs/apk/release/ai-release.apk "dist/focus-study-mate-v${VERSION_NAME}.apk"
          for f in dist/*.apk; do
            "$BT/apksigner" verify --print-certs "$f"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Keep APKs as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-signed-apks
          path: dist/*

      - name: Publish GitHub release (only when versionName changed)
        if: env.BUMP == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Focus v${{ env.VERSION_NAME }}
          files: dist/*
          prerelease: ${{ contains(env.VERSION_NAME, 'beta') }}
          body_path: fastlane/metadata/android/en-US/changelogs/${{ env.VERSION_CODE }}.txt
